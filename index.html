<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Complete</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(180deg, #fafafa 0%, #f0f0f3 100%);
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .icon-wrap {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #e9f5ea;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap svg { width: 28px; height: 28px; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: #3D8E41;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  #continueBtn {
    display: none;
    background: #3D8E41;
    color: #ffffff;
    border: none;
    width: 100%;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  #continueBtn:active { opacity: 0.85; }
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap" id="iconWrap">
    <div class="spinner"></div>
  </div>
  <h1 id="title">Setup complete</h1>
  <p id="subtitle">Taking you back to Neemow...</p>
  <a id="continueBtn">Continue</a>
</div>

<script>
  function getTarget() {
    const params = new URLSearchParams(window.location.search);
    const target = params.get("to");
    if (target && /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(target)) {
      return target;
    }
    return null;
  }

  const target = getTarget();
  const btn = document.getElementById("continueBtn");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const iconWrap = document.getElementById("iconWrap");

  if (!target) {
    title.textContent = "Something went wrong";
    subtitle.textContent = "We couldn't find where to redirect you.";
    iconWrap.style.display = "none";
  } else {
    // Attempt automatic redirect (works on Android, usually silently blocked on iOS)
    window.location.href = target;

    btn.href = target;

    // If still on this page after a short delay, auto-redirect was blocked (iOS).
    // A tap satisfies iOS's user-gesture requirement for the handoff to succeed.
    setTimeout(function () {
      if (document.visibilityState === "visible") {
        iconWrap.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M20 6L9 17l-5-5" stroke="#3D8E41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';
        title.textContent = "Setup complete";
        subtitle.textContent = "Your account is ready. Tap below to continue to Neemow.";
        btn.style.display = "inline-block";
      }
    }, 900);
  }
</script>
</body>
</html>
