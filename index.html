<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to Neemow</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(180deg, #fafafa 0%, #f0f0f3 100%);
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .icon-wrap {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #e9f5ea;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap svg { width: 28px; height: 28px; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: #3D8E41;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .return-link {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: #3D8E41;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 4px;
  }
  .return-link:active {
    background: #33792f;
  }
  .web-link {
    display: none;
    margin-top: 16px;
    font-size: 14px;
    color: #3D8E41;
    font-weight: 500;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap" id="iconWrap">
    <div class="spinner"></div>
  </div>
  <h1 id="title">Taking you back to Neemow</h1>
  <p id="subtitle">One moment...</p>
  <a class="return-link" id="returnLink" href="#">Open the Neemow app</a>
  <a class="web-link" id="webLink" href="#">Using Neemow in your browser? Continue on www.neemow.com</a>
</div>

<script>
  // The app links here as ?to=neemow://neemow.com/<page>?id=1&cusId=cus_2,
  // unencoded. URLSearchParams would split that at the "&" and silently drop
  // every parameter after the first, so take everything after "to=" instead.
  function getTarget() {
    const match = window.location.search.match(/[?&]to=(.*)$/);
    if (!match) return null;
    let target = match[1];
    try {
      target = decodeURIComponent(target);
    } catch (e) {
      // Not encoded (or contains a bare "%"); use it as-is.
    }
    // Only ever hand off to the app. Anything else would make this page an
    // open redirect on a neemow.com domain.
    return /^neemow:\/\//i.test(target) ? target : null;
  }

  const target = getTarget();
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const iconWrap = document.getElementById("iconWrap");
  const returnLink = document.getElementById("returnLink");
  const webLink = document.getElementById("webLink");

  // Same page on the website: neemow://neemow.com/x?id=1 -> https://www.neemow.com/x?id=1
  function webUrlFor(appUrl) {
    return appUrl.replace(/^neemow:\/\/(neemow\.com)?\/?/i, "https://www.neemow.com/");
  }

  // There is no Neemow app on a computer, so a desktop visitor can only be a
  // website user -- send them straight back to www.neemow.com.
  const isPhone =
    /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if (!target) {
    title.textContent = "Something went wrong";
    subtitle.textContent = "We couldn't find where to redirect you.";
    iconWrap.style.display = "none";
  } else if (!isPhone) {
    window.location.replace(webUrlFor(target));
  } else {
    returnLink.href = target;
    webLink.href = webUrlFor(target);

    // Best-effort automatic hand-off. Android usually follows it; iOS Safari
    // blocks a scripted custom-scheme redirect that isn't a direct response
    // to a tap.
    window.location.href = target;

    // Still here, so the hand-off was blocked. The app opens Stripe in the
    // full Safari/Chrome app (LaunchMode.externalApplication), which has no
    // close (X) button to point at -- give the user a real link instead.
    // Browsers do follow a custom-scheme link when it is actually tapped.
    //
    // This page is also the return for failed or cancelled payments, so the
    // wording stays neutral rather than announcing success.
    setTimeout(function () {
      if (document.visibilityState === "visible") {
        iconWrap.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M5 12h14M13 6l6 6-6 6" stroke="#3D8E41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';
        title.textContent = "You're all set here";
        subtitle.textContent = "Tap below to go back to Neemow.";
        returnLink.style.display = "flex";
        webLink.style.display = "inline-block";
      }
    }, 900);
  }
</script>
</body>
</html>
