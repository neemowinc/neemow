<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Complete</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(180deg, #fafafa 0%, #f0f0f3 100%);
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .icon-wrap {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #e9f5ea;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap svg { width: 28px; height: 28px; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: #3D8E41;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .close-instruction {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #f4f9f4;
    border: 1px solid #d7ecd8;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 4px;
  }
  .close-instruction .x-badge {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ffffff;
    border: 1.5px solid #d1d5db;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #4b5563;
  }
  .close-instruction span {
    font-size: 14px;
    color: #1a1a1a;
    font-weight: 500;
    text-align: left;
  }
  .pointer-arrow {
    display: none;
    position: fixed;
    top: 18px;
    left: 30px;
    width: 40px;
    height: 40px;
    z-index: 10;
  }
</style>
</head>
<body>
<svg class="pointer-arrow" id="pointerArrow" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M50 45C35 40 15 30 8 8" stroke="#3D8E41" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M2 12L8 8L11 15" stroke="#3D8E41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

<div class="card">
  <div class="icon-wrap" id="iconWrap">
    <div class="spinner"></div>
  </div>
  <h1 id="title">Setup complete</h1>
  <p id="subtitle">Taking you back to Neemow...</p>
  <div class="close-instruction" id="closeInstruction">
    <div class="x-badge">✕</div>
    <span>Tap the ✕ in the top corner to return to Neemow</span>
  </div>
</div>

<script>
  function getTarget() {
    const params = new URLSearchParams(window.location.search);
    const target = params.get("to");
    if (target && /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(target)) {
      return target;
    }
    return null;
  }

  const target = getTarget();
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const iconWrap = document.getElementById("iconWrap");
  const closeInstruction = document.getElementById("closeInstruction");
  const pointerArrow = document.getElementById("pointerArrow");

  if (!target) {
    title.textContent = "Something went wrong";
    subtitle.textContent = "We couldn't find where to redirect you.";
    iconWrap.style.display = "none";
  } else {
    // Attempt automatic redirect (works on Android, usually silently blocked on iOS)
    window.location.href = target;

    // If still on this page after a short delay, auto-redirect was blocked (iOS).
    // Show clear instructions to use the native close (X) control instead.
    setTimeout(function () {
      if (document.visibilityState === "visible") {
        iconWrap.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M20 6L9 17l-5-5" stroke="#3D8E41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '</svg>';
        title.textContent = "Setup complete";
        subtitle.textContent = "Your account is ready.";
        closeInstruction.style.display = "flex";
        pointerArrow.style.display = "block";
      }
    }, 900);
  }
</script>
</body>
</html>
